[package]
name = "easybill"
version = "0.1.0"
edition = "2021"
description = "Reusable read-only client for the easybill REST v1 API."
license = "Apache-2.0"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
tokio = { version = "1", features = ["time"] }
