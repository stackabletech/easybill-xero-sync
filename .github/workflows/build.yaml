---
# Builds the container image and pushes it to oci.stackable.tech:
#
# - a tag `vX.Y.Z` publishes `X.Y.Z` (the tag must match the Cargo.toml version)
# - a push to `main` publishes `0.0.0-dev` (floating) and `0.0.0-dev-<sha>`
# - a pull request only runs the checks and a test build (nothing is pushed)
#
# Repository settings needed:
# - variable `REGISTRY_NAMESPACE`: the Harbor project on oci.stackable.tech
# - secret `HARBOR_ROBOT_SECRET`: the secret of the robot account
#   `robot$<REGISTRY_NAMESPACE>+github-action-build`
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: oci.stackable.tech
  IMAGE_NAME: easybill-xero
  # Keep in sync with the builder image in the Dockerfile.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "easybill-xero") | .version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match the Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    name: Build/Publish Image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Keyless cosign signing.
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository settings
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
        run: |
          if [ -z "$REGISTRY_NAMESPACE" ]; then
            echo "Set the repository variable REGISTRY_NAMESPACE" >&2
            exit 1
          fi

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE || 'unset' }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=0.0.0-dev,enable={{is_default_branch}}
            type=raw,value=0.0.0-dev-{{sha}},enable={{is_default_branch}}
            type=ref,event=pr

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ${{ env.REGISTRY }}
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: robot$${{ vars.REGISTRY_NAMESPACE }}+github-action-build
          password: ${{ secrets.HARBOR_ROBOT_STACKABLE_GITHUB_ACTION_BUILD_SECRET }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ vars.REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
